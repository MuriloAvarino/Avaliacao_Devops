#cloud-config
package_update: true

packages:
  - docker.io
  - docker-compose-v2
  - python3

users:
  - name: ubuntu
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ${ssh_key}

runcmd:
  - systemctl enable docker
  - systemctl start docker